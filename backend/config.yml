# Настройки backend Bumpy.
#
# Единственный источник настроек приложения и БД: код не содержит ни путей, ни
# лимитов, ни параметров SQLite. Путь к файлу можно переопределить переменной
# окружения BUMPY_CONFIG (в docker-образе она уже указывает на этот файл).
#
# Относительные пути (path, migrations_dir) разрешаются относительно каталога,
# в котором лежит ЭТОТ файл, а не относительно текущего каталога процесса.

database:
  # Лёгкая встраиваемая СУБД SQLite: один файл вместо отдельного сервера БД.
  # /data — docker-том, поэтому база переживает пересоздание контейнера и
  # деплой. Для локального запуска используется backend/data/bumpy.db.
  path: /data/bumpy.db

  # Каталог с SQL-миграциями: применяются при старте в порядке имени файла
  # (001_init.sql, 002_...sql). Уже применённые фиксируются в таблице
  # schema_migrations и повторно не выполняются.
  migrations_dir: migrations

  # WAL: читатели не блокируют писателя, БД переживает падение процесса.
  journal_mode: WAL
  # NORMAL — безопасный компромисс: fsync на чекпоинтах WAL, а не на каждой
  # транзакции. Для игровых профилей достаточно.
  synchronous: NORMAL
  # Сколько ждать освобождения блокировки записи (миллисекунды).
  busy_timeout_ms: 5000

  # Хранить историю событий игрока (изменение имени, старт игры, прохождение
  # уровня, game over). Отключается без изменения схемы — просто перестаёт
  # писаться и отдаваться.
  events: true

api:
  host: 0.0.0.0
  port: 8000

  # --- пароли игроков -------------------------------------------------------
  # Имя игрока уникально в БД, вход по имени требует пароль. Пароль хранится
  # только как PBKDF2-HMAC-SHA256 (см. app/passwords.py); итерации берутся
  # отсюда, поэтому их можно поднять без правки кода — у каждой записи в БД
  # хранится своё значение, старые хэши продолжают проверяться.
  password_iterations: 120000
  # Минимальная и максимальная длина пароля (символы).
  password_min_len: 4
  password_max_len: 32

  # Пустая строка — открытый доступ. Иначе клиент обязан присылать заголовок
  # X-Api-Key. Ключ зашит в wasm-бандл игры, поэтому это защита от случайных
  # запросов, а не от целевого взлома.
  api_key: ""

  # Ограничения на значения, принимаемые от клиента (защита БД от мусора).
  max_name_len: 16
  max_levels: 1000
  max_visits: 1000000
  max_items: 9999

  # Сколько последних событий отдавать в GET /api/players/{id}.
  events_limit: 20
  # Размер страницы лидерборда GET /api/players.
  page_size: 50

  # CORS-источники для запросов из браузера.
  #
  # ВАЖНО: даже при работе через nginx-прокси на том же origin браузер делает
  # preflight (OPTIONS) перед PUT с Content-Type: application/json — этот тип
  # не входит в «простые». Без CORS-обработчика preflight получает 405, и
  # сохранение в БД молча перестаёт работать в HTML5-сборке.
  # "*" достаточно: API не использует cookie/credentials.
  cors_origins:
    - "*"

  log_level: info

  # Версия API, отдаётся в /api/health (клиент может проверить совместимость).
  version: 1

# Сгенерированные уровни (таблица generated_levels).
#
# Уровни создаёт генератор tools/gen_level.py: он строит кандидатов по seed и
# сохраняет в БД ТОЛЬКО те, для которых решатель tools/solve_level.py
# подтвердил проходимость (is_solvable → "solvable"). Часовой запуск —
# tools/gen_hourly.py (по cron/systemd timer), он добавляет ровно один уровень
# за запуск.
levels:
  # Сколько последних уровней участвует в случайной выдаче
  # (GET /api/levels/random). Старые остаются в БД для истории.
  window: 500
  # Сколько последних уровней отдаёт GET /api/levels/latest.
  latest_limit: 10
  # Сколько уровней хранить при очистке генератором (0 — не чистить).
  keep: 2000
