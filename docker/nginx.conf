worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Required for WebAssembly streaming compilation
    types {
        application/wasm  wasm;
    }

    sendfile        on;
    keepalive_timeout  65;
    gzip              on;
    gzip_types        application/javascript application/json application/wasm text/css text/plain;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Cross-origin isolation is required by the Defold pthread (SharedArrayBuffer)
        # build. These headers MUST be present on the document (index.html) response,
        # otherwise the engine cannot start and the canvas stays black. Set them at
        # the server level so every response (html, js, wasm) carries them.
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        location = /index.html {
            add_header Cross-Origin-Opener-Policy   "same-origin"  always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cache-Control "no-cache";
        }

        location / {
            add_header Cross-Origin-Opener-Policy   "same-origin"  always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            try_files $uri $uri/ /index.html;
        }

        # Ensure correct content types for the Defold engine bundle
        location ~* \.wasm$ {
            types { }
            default_type application/wasm;
            add_header Cross-Origin-Opener-Policy   "same-origin"  always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }

        location ~* \.(js|arcd|arci|dmanifest|projectc)$ {
            add_header Cross-Origin-Opener-Policy   "same-origin"  always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
