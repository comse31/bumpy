worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Required for WebAssembly streaming compilation
    types {
        application/wasm  wasm;
    }

    sendfile        on;
    keepalive_timeout  65;
    gzip              on;
    gzip_types        application/javascript application/json application/wasm text/css text/plain;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Long cache for hashed/immutable engine assets, no cache for html
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Ensure correct content types for the Defold engine bundle
        location ~* \.wasm$ {
            types { }
            default_type application/wasm;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }

        location ~* \.(js|arcd|arci|dmanifest|projectc)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
