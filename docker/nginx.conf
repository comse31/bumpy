worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # MIME application/wasm уже объявлен в /etc/nginx/mime.types образа
    # nginx:1.27-alpine (проверено: warning "duplicate extension wasm").
    # Определять его здесь повторно не нужно — это только шумит в логах.

    sendfile        on;
    keepalive_timeout  65;
    gzip              on;
    gzip_types        application/javascript application/json application/wasm text/css text/plain;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Cache policy.
        #
        # Файлы HTML5-бандла Defold НЕ имеют хеша содержимого в имени
        # (index.html, dmloader.js, bumpy.wasm, archive/*.arcd|*.arci,
        # *.dmanifest, *.projectc). Если их кешировать, то после нового
        # деплоя браузер переиспользует старый движок/архив, а свежий
        # index.html — нет; набор файлов оказывается несовместимым и игра
        # не стартует. Поэтому кеш полностью отключаем:
        #   * index.html — no-store: документ-точка входа никогда не
        #     переиспользуется из кеша;
        #   * остальные файлы — no-cache: браузер обязан ревалидировать их
        #     по ETag/Last-Modified, поэтому неизменившиеся файлы по-прежнему
        #     отвечают 304, а пересобранный файл подхватывается сразу.
        #
        # add_header НЕ наследуется в location, если тот задаёт свой add_header,
        # поэтому кеш- и COOP/COEP-заголовки продублированы в каждом location.

        # Cross-origin isolation is required by the Defold pthread (SharedArrayBuffer)
        # build. These headers MUST be present on the document (index.html) response,
        # otherwise the engine cannot start and the canvas stays black.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
            add_header Cross-Origin-Opener-Policy   "same-origin"  always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            add_header Cross-Origin-Opener-Policy   "same-origin"  always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            try_files $uri $uri/ /index.html;
        }

        # Ensure correct content types for the Defold engine bundle
        location ~* \.wasm$ {
            types { }
            default_type application/wasm;
            add_header Cache-Control "no-cache" always;
            add_header Cross-Origin-Opener-Policy   "same-origin"  always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }

        location ~* \.(js|arcd|arci|dmanifest|projectc|json)$ {
            add_header Cache-Control "no-cache" always;
            add_header Cross-Origin-Opener-Policy   "same-origin"  always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }
    }
}
