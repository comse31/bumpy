# Сборка и развёртывание Bumpy (Defold, wasm-web) на self-hosted раннере.
#
# Триггер: push в ветку master (и ручной запуск через workflow_dispatch).
#
# Шаги:
#   1. Получение headless-инструмента Defold (bob.jar): из кэша раннера или из
#      ассета GitHub Release `bob-jar-<sha1>` (публикуется вручную workflow
#      fetch-bob.yml), с fallback на d.defold.com.
#   2. Сборка HTML5-бандла (platform wasm-web, archive=true) в dist/web/bumpy.
#   3. Сборка Docker-образа (docker/Dockerfile: nginx + бандл).
#   4. Развёртывание контейнера на раннере + health check.
#
# Job выполняется на self-hosted раннере с меткой `teliot`. Контейнер
# запускается на Docker-демоне этого раннера (реальная машина), поэтому после
# workflow он продолжает работать (в отличие от эфемерных GitHub-hosted раннеров).

name: Build & Deploy (master)

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Отменять предыдущий запуск при новом пуше в master.
concurrency:
  group: deploy-master
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: bumpy-web
  IMAGE_TAG: latest
  CONTAINER_NAME: bumpy-web
  HOST_PORT: "9999"
  BOB_BUILDER_IMAGE: bumpy-bob-builder:25-jdk

jobs:
  build-and-deploy:
    name: Сборка образа и развёртывание на self-hosted (teliot)
    # Self-hosted раннер с меткой `teliot`. Требуется установленный Docker.
    runs-on: [self-hosted]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Определение версии Defold (sha1)
        id: defold
        run: |
          set -euo pipefail
          SHA1="$(curl -fsSL https://d.defold.com/stable/info.json \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["sha1"])')"
          echo "sha1=${SHA1}" >> "$GITHUB_OUTPUT"
          echo "Defold stable sha1: ${SHA1}"

      - name: Кэш bob.jar (ключ по версии Defold)
        # Кэш привязан к sha1 стабильной версии Defold: пока версия не меняется,
        # bob.jar (220 МБ) не скачивается повторно. На self-hosted раннере кэш
        # сохраняется между запусками.
        id: bob-cache
        uses: actions/cache@v4
        with:
          path: bob.jar
          key: defold-bob-${{ steps.defold.outputs.sha1 }}

      - name: Получение bob.jar (только при отсутствии в кэше)
        # bob.jar публикуется вручную отдельным workflow fetch-bob.yml как ассет
        # GitHub Release `bob-jar-<sha1>` — скачивание с GitHub быстрее, чем с
        # d.defold.com. Если релиза нет, берём из исходного источника.
        if: steps.bob-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SHA1="${{ steps.defold.outputs.sha1 }}"
          ASSET_URL="https://github.com/comse31/bumpy/releases/download/bob-jar-${SHA1}/bob.jar"
          echo "Пробую скачать bob.jar из релиза: ${ASSET_URL}"
          if curl -fsSL -o bob.jar "${ASSET_URL}"; then
            echo "bob.jar получен из GitHub Release bob-jar-${SHA1}"
          else
            echo "Релиз bob-jar-${SHA1} недоступен — скачиваю с d.defold.com"
            curl -fsSL -o bob.jar "https://d.defold.com/archive/${SHA1}/bob/bob.jar"
          fi
          ls -lh bob.jar

      - name: Сборка образа-сборщика bob (кэшируется Docker'ом)
        # Образ bumpy-bob-builder:25-jdk (JDK 25 + библиотеки X11/GL) собирается
        # один раз; при повторных запусках слои берутся из кэша Docker, apt-get
        # не выполняется. См. docker/bob-builder.Dockerfile.
        run: |
          set -euo pipefail
          docker build \
            -f docker/bob-builder.Dockerfile \
            -t "${BOB_BUILDER_IMAGE}" \
            .

      - name: Сборка HTML5-бандла (wasm-web) в контейнере с JDK
        # bob.jar собран под Java 25 (class file version 69), поэтому запускаем
        # его в образе bumpy-bob-builder (JDK 25 + системные библиотеки X11/GL,
        # которые нужны нативным инструментам bob, напр. ModelImporterJni) —
        # сборка НЕ зависит от системной Java на раннере. Репозиторий
        # монтируется в контейнер, готовый бандл остаётся на раннере в
        # dist/web/bumpy и далее попадает в docker-образ.
        #
        # Для HTML5 bob создаёт вложенную папку с именем проекта (title=bumpy)
        # внутри --bundle-output, т.е. результат окажется в dist/web/bumpy/
        # (index.html, dmloader.js, *.wasm, archive/).
        run: |
          set -euo pipefail
          rm -rf dist/web/bumpy
          docker run --rm \
            -v "$PWD":/project \
            -w /project \
            "${BOB_BUILDER_IMAGE}" \
            java -jar bob.jar \
              --root . \
              --platform wasm-web \
              --archive \
              --variant release \
              --bundle-output dist/web \
              resolve build bundle
          test -f dist/web/bumpy/index.html
          ls -la dist/web/bumpy

      - name: Остановка и удаление старого контейнера
        run: |
          set -euo pipefail
          # Есть ли контейнер вообще (запущенный или остановленный).
          if ! docker ps -a --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
            echo "Контейнер ${CONTAINER_NAME} не найден — пропускаю"
            exit 0
          fi
          # Запущен ли он — останавливаем только работающий контейнер.
          if docker ps --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
            echo "Останавливаю запущенный контейнер ${CONTAINER_NAME}"
            docker stop "${CONTAINER_NAME}"
          else
            echo "Контейнер ${CONTAINER_NAME} уже остановлен — stop не требуется"
          fi
          echo "Удаляю контейнер ${CONTAINER_NAME}"
          docker rm "${CONTAINER_NAME}"

      - name: Сборка Docker-образа
        run: |
          set -euo pipefail
          docker build \
            -f docker/Dockerfile \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            .
          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format 'Образ собран: {{.RepoTags}} ({{.Size}} байт)'

      - name: Развёртывание контейнера на self-hosted раннере (teliot)
        # `docker` здесь — это Docker-демон self-hosted раннера `teliot`
        # (реальная машина), на которой выполняется job. Контейнер остаётся
        # работать после завершения workflow (в отличие от эфемерных
        # GitHub-hosted раннеров). Старый контейнер удаляется отдельным шагом.
        run: |
          set -euo pipefail
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p "${HOST_PORT}:80" \
            --restart unless-stopped \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Проверка доступности (health check)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:${HOST_PORT}/"; then
              echo "Сервис отвечает на http://localhost:${HOST_PORT}/"
              break
            fi
            echo "Ожидание запуска nginx... (${i}/30)"
            sleep 2
          done
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "http://localhost:${HOST_PORT}/"
          docker ps --filter "name=${CONTAINER_NAME}"

      - name: Диагностика при ошибке
        if: failure()
        run: |
          docker ps -a || true
          docker logs "${CONTAINER_NAME}" || true
