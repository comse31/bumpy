# Сборка и публикация образа-сборщика Defold (bob) в Docker Hub.
#
# ЗАПУСК ТОЛЬКО ВРУЧНУЮ (workflow_dispatch): автоматических триггеров нет.
# Образ тегируется версией bob (sha1 версии Defold), например:
#   <DOCKERHUB_USERNAME>/bumpy-bob-builder:<sha1>
# Этот же тег использует deploy-master (по текущей stable-версии Defold).
#
# Образ содержит зависимости сборки HTML5-бандла, чтобы во время
# `deploy-master` не выполнялся `docker build`:
#   * JDK 25 + системные библиотеки X11/GL;
#   * bob.jar (скачивается из GitHub Release `bob-jar-<sha1>` либо с d.defold.com).
#
# Движки HTML5 в образ НЕ зашиваются: `deploy-master` собирает только
# однопоточный движок (`--architectures wasm-web`), а он лежит внутри bob.jar
# (libexec/wasm-web) — в сеть ходить не нужно.
#
# Требуются секреты репозитория: DOCKERHUB_USERNAME и DOCKERHUB_TOKEN.
#
# Так как образ кэшируется по слоям, повторная сборка при неизменном sha1
# быстрая.

name: Build & Publish bob-builder image

on:
  workflow_dispatch:
    inputs:
      defold_sha1:
        description: "sha1 версии Defold (bob). Пусто — взять текущую stable с d.defold.com"
        required: false
        default: ""

concurrency:
  group: build-bob-image
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bumpy-bob-builder

jobs:
  build-and-push:
    name: Сборка и публикация образа-сборщика
    # Self-hosted раннер с установленным Docker (как и deploy-master).
    runs-on: [self-hosted]
    # Запас: bob.jar (~220 МБ) качается из GitHub Release; apt-get ставит X11/GL.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Определение версии Defold (sha1)
        id: defold
        run: |
          set -euo pipefail
          SHA1="${{ inputs.defold_sha1 }}"
          if [ -z "$SHA1" ]; then
            SHA1="$(curl -fsSL https://d.defold.com/stable/info.json \
              | python3 -c 'import sys, json; print(json.load(sys.stdin)["sha1"])')"
          fi
          echo "sha1=${SHA1}" >> "$GITHUB_OUTPUT"
          echo "Версия bob (sha1): ${SHA1}"

      - name: Логин в Docker Hub
        run: |
          set -euo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Сборка образа-сборщика
        run: |
          set -euo pipefail
          docker build \
            --build-arg BOB_SHA1="${{ steps.defold.outputs.sha1 }}" \
            -f docker/bob-builder.Dockerfile \
            -t "${IMAGE_NAME}:${{ steps.defold.outputs.sha1 }}" \
            .
          docker image inspect "${IMAGE_NAME}:${{ steps.defold.outputs.sha1 }}" \
            --format 'Образ собран: {{.RepoTags}} ({{.Size}} байт)'

      - name: Публикация в Docker Hub
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${{ steps.defold.outputs.sha1 }}"
          echo "Опубликовано: ${IMAGE_NAME}:${{ steps.defold.outputs.sha1 }}"
